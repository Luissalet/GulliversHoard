[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gulliver-hoard"
version = "0.1.0"
description = "Printable 3D map models: a place on the map becomes a closed solid with relief, buildings, water, roads and parks, tiled for the printer bed, as STL and multi-part 3MF."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27", "mcp>=1.10,<2", "numpy>=1.26", "scipy>=1.11",
                "shapely>=2.0", "manifold3d>=3.0", "pillow>=10.1", "trimesh>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "networkx>=3", "lxml>=5"]

[project.scripts]
gulliver-hoard = "gulliver_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["gulliver_hoard*"]

[tool.setuptools.package-data]
gulliver_hoard = ["static/**/*", "hoard_link/_data/**/*", "hoard_link/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
